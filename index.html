<style>

  --blue:#2f80ed;--blue2:#1557b0;--baby:#9edfff;

.event{display:flex;flex-direction:column}.event-top{display:flex;justify-content:space-between;align-items:center}.date{background:var(--blue2);color:#fff;padding:8px 11px;border-radius:999px;font-weight:1000;font-size:13px}.event .btn{margin-top:auto;align-self:flex-start}

.milestones .card{border-left:8px solid var(--blue)}.milestones .card:nth-child(2){border-left-color:var(--purple)}.milestones .card:nth-child(3){border-left-color:var(--orange)}.milestones .card:nth-child(4){border-left-color:var(--brown)}

.about-card{background:linear-gradient(135deg,#e8f8ff,#f1eaff,#fff0e5)!important}

footer{background:linear-gradient(135deg,#4a2c20,#29183c,#113a5a);color:#fff;text-align:center;padding:38px 18px;line-height:1.7}
.top{position:fixed;right:18px;bottom:18px;display:none;width:49px;height:49px;border:0;border-radius:50%;background:var(--purple2);color:#fff;font-size:22px;font-weight:1000;cursor:pointer;box-shadow:0 9px 22px #0004;z-index:50}
.confetti{position:fixed;pointer-events:none;font-size:24px;animation:fall 1.8s linear forwards;z-index:100}

}

.horse-photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}

.facts99 .section-title p{color:#dbeafe}.facts-intro{background:#ffffff16;border:1px solid #ffffff30;border-radius:22px;padding:18px;line-height:1.6}
.facts-toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}

function updateProgress(){
  const v=prompt("Enter progress percentage (0–100):",progress);
  if(v===null)return;
  const n=Number(v);
  if(Number.isFinite(n)&&n>=0&&n<=100){progress=Math.round(n);localStorage.setItem("psc_progress",progress);renderProgress();celebrate();}
  else alert("Please enter a number from 0 to 100.");
}
renderProgress();

function orders(){return JSON.parse(localStorage.getItem("psc_orders")||"[]")}

function setupMissions(){
  const saved=JSON.parse(localStorage.getItem("psc_missions")||"{}");
  const boxes=[...document.querySelectorAll("[data-mission]")];
  boxes.forEach(box=>{
    box.checked=!!saved[box.dataset.mission];
    box.closest(".mission").classList.toggle("done",box.checked);
    box.addEventListener("change",()=>{
      saved[box.dataset.mission]=box.checked;
      localStorage.setItem("psc_missions",JSON.stringify(saved));
      box.closest(".mission").classList.toggle("done",box.checked);
      renderMissions();
    });
  });
  renderMissions();
}
function renderMissions(){
  const done=[...document.querySelectorAll("[data-mission]")].filter(x=>x.checked).length;
  const el=document.getElementById("missionCount");
  if(el) el.textContent=done+" of 4 missions complete"+(done===4?" — amazing work! 🎉":"");
}
setupMissions();

function updateStats(){
  document.getElementById("statOrders").textContent=orders().length;
  const v=JSON.parse(localStorage.getItem("psc_votes")||"{}");
  document.getElementById("statVotes").textContent=Object.values(v).reduce((a,b)=>a+b,0);
}
function openOrder(type){
  document.getElementById("type").value=type;
  const p=document.getElementById("order");p.classList.add("show");
  p.scrollIntoView({behavior:"smooth",block:"center"});
}
function closeOrder(){document.getElementById("order").classList.remove("show")}
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  const r=orders();
  r.push({
    craft:document.getElementById("type").value,
    item:document.getElementById("item").value.trim(),
    qty:document.getElementById("qty").value,
    extra:document.getElementById("extra").value.trim(),
    savedAt:new Date().toISOString()
  });
  localStorage.setItem("psc_orders",JSON.stringify(r));
  const m=document.getElementById("om");m.textContent="Request saved! ✅ Show it to an adult helper to arrange the in-person order.";m.classList.add("show");
  e.target.reset();updateStats();celebrate();
});

const voteData=[["a","Pumpkin Wizard","🧙🎃"],["b","Spooky Cat","🐈‍⬛🎃"],["c","Superhero","🦸🎃"],["d","Classic Ghost","👻🎃"]];
function voteDataSaved(){return JSON.parse(localStorage.getItem("psc_votes")||"{}")}
function drawVotes(){
  const v=voteDataSaved();
  document.getElementById("entries").innerHTML=voteData.map(x=>
    '<div class="vote"><div><div class="vote-name">'+x[2]+' '+x[1]+'</div><div class="vote-count">'+(v[x[0]]||0)+' vote'+((v[x[0]]||0)===1?'':'s')+'</div></div><button class="btn" onclick="vote(&quot;'+x[0]+'&quot;)">Vote 🎃</button></div>'
  ).join("");
}
drawVotes();
function vote(id){
  if(localStorage.getItem("psc_voted")==="yes"){
    const m=document.getElementById("vm");m.textContent="You’ve already voted on this device. 💛";m.classList.add("show");return;
  }
  const v=voteDataSaved();v[id]=(v[id]||0)+1;
  localStorage.setItem("psc_votes",JSON.stringify(v));localStorage.setItem("psc_voted","yes");
  drawVotes();updateStats();celebrate();
  const m=document.getElementById("vm");m.textContent="Vote saved! 🎉";m.classList.add("show");
}

function eventInfo(name){alert(name+" information will be posted here by the club/adult helper. 🎉")}
function faq(btn){btn.classList.toggle("open")}
function revealMessage(){document.getElementById("secretBox").classList.toggle("show")}
function celebrate(){
  const chars=["✨","⭐","🎉","💛","🧶","🎃","💙","💜","🧡"];
  for(let i=0;i<22;i++){
    const s=document.createElement("div");s.className="confetti";s.textContent=chars[Math.floor(Math.random()*chars.length)];
    s.style.left=(Math.random()*100)+"vw";s.style.top=(-10-Math.random()*20)+"px";
    s.style.animationDelay=(Math.random()*.5)+"s";document.body.appendChild(s);
    setTimeout(()=>s.remove(),2200);
  }
}
const halloween=new Date("2026-10-31T18:00:00");
function countdown(){
  const diff=halloween-new Date();
  if(diff<=0){document.getElementById("countText").textContent="🎃 Halloween time! Have fun!";["days","hours","mins","secs"].forEach(id=>document.getElementById(id).textContent="00");return}
  document.getElementById("days").textContent=String(Math.floor(diff/86400000)).padStart(2,"0");
  document.getElementById("hours").textContent=String(Math.floor(diff/3600000)%24).padStart(2,"0");
  document.getElementById("mins").textContent=String(Math.floor(diff/60000)%60).padStart(2,"0");
  document.getElementById("secs").textContent=String(Math.floor(diff/1000)%60).padStart(2,"0");
}
countdown();setInterval(countdown,1000);updateStats();
window.addEventListener("scroll",()=>document.getElementById("top").style.display=scrollY>500?"block":"none");

let reminders=localStorage.getItem("psc_daily_reminders")==="yes";
function updateMemberHub(){
  const diff=halloween-new Date();
  const d=Math.max(0,Math.ceil(diff/86400000));
  document.getElementById("memberCountdown").textContent=d;
  document.getElementById("memberProgress").textContent=progress+"%";
  document.getElementById("reminderSwitch").classList.toggle("on",reminders);
  document.getElementById("reminderStatus").textContent=reminders?"Daily reminders are ON 🔔":"Reminders are off.";
}
async function toggleReminders(){
  if(!("Notification" in window)){
    document.getElementById("reminderStatus").textContent="This browser does not support notifications.";
    return;
  }
  if(!reminders){
    const permission=await Notification.requestPermission();
    if(permission!=="granted"){
      document.getElementById("reminderStatus").textContent="Notifications were not allowed.";
      return;
    }
    reminders=true;localStorage.setItem("psc_daily_reminders","yes");
    sendDailyReminder(true);
  }else{
    reminders=false;localStorage.setItem("psc_daily_reminders","no");
  }
  updateMemberHub();
}
function sendDailyReminder(first=false){
  if(!reminders || !("Notification" in window) || Notification.permission!=="granted")return;
  const today=new Date().toISOString().slice(0,10);
  const last=localStorage.getItem("psc_last_reminder");
  if(first || last!==today){
    const days=Math.max(0,Math.ceil((halloween-new Date())/86400000));
    new Notification("Pony Sitters Club 🎃",{body:days+" days until Halloween! Keep following the secret goal. 🤫"});
    localStorage.setItem("psc_last_reminder",today);
  }
}

let factsVisible=24;
function renderHorseFacts99(){
  const grid=document.getElementById("factsGrid");
  const count=document.getElementById("factsCount");
  const query=(document.getElementById("factSearch").value||"").toLowerCase().trim();
  const active=document.querySelector(".fact-filter.active")?.dataset.factFilter||"All";
  const filtered=horseFacts99.map((x,i)=>({category:x[0],title:x[1],text:x[2],num:i+1}))
    .filter(x=>(active==="All"||x.category===active) && (!query || (x.title+" "+x.text+" "+x.category).toLowerCase().includes(query)));
  const shown=filtered.slice(0,factsVisible);
  count.textContent=filtered.length+" fact"+(filtered.length===1?"":"s")+" found • showing "+shown.length;
  grid.innerHTML=shown.length?shown.map(x=>'<article class="fact-card"><div class="fact-top"><span class="fact-num">'+x.num+'</span><span class="fact-tag">'+x.category+'</span></div><h3>'+x.title+'</h3><p>'+x.text+'</p></article>').join("")
  :'<div class="fact-empty">No facts matched that search. 🐴</div>';
  const more=document.getElementById("factsShowMore");
  more.style.display=shown.length<filtered.length?"inline-block":"none";
  more.textContent="Show more facts ("+(filtered.length-shown.length)+")";
}
