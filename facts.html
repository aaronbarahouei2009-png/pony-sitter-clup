<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>99 Horse Facts 🐴</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#30252a;background:linear-gradient(180deg,#f8fcff,#f3edff,#fff3e9)}
header{color:#fff;text-align:center;padding:32px 16px;background:linear-gradient(135deg,#1557b0,#6c35b8,#d94f00)}
h1{margin:0;font-size:clamp(34px,7vw,58px)}header p{font-weight:800;margin:10px 0 0}
main{max-width:1100px;margin:auto;padding:24px 14px 50px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button,input{font:inherit}button{border:0;border-radius:999px;padding:9px 13px;font-weight:900;cursor:pointer;background:#e9efff;color:#4d2496}
button.active,button:hover{background:#4d2496;color:#fff}
input{flex:1;min-width:220px;padding:11px 14px;border:2px solid #cfdbeb;border-radius:999px;background:#fff}
.count{font-weight:900;color:#6b5d68;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;max-height:760px;overflow:auto;padding-right:4px}
.card{background:#fff;border:2px solid #cfdbeb;border-radius:16px;padding:12px;box-shadow:0 6px 14px #0001}
.top{display:flex;justify-content:space-between;align-items:center}
.num{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2f80ed,#7b4dcc);color:#fff;font-weight:900;font-size:13px}
.tag{font-size:10px;background:#eef2ff;color:#4d2496;border-radius:999px;padding:4px 7px;font-weight:900}
.card h2{font-size:16px;margin:8px 0 4px}.card p{font-size:14px;line-height:1.4;color:#625365;margin:0}
.more{display:block;margin:14px auto;background:#ff7a1a;color:#fff}
.back{display:inline-block;margin-top:8px;text-decoration:none;color:#fff;font-weight:900}
.empty{text-align:center;padding:20px;background:#fff;border-radius:16px;font-weight:900}

/* extra motion */
body{background-size:140% 140%;animation:bgDrift 16s ease-in-out infinite alternate}
@keyframes bgDrift{from{background-position:0% 0%}to{background-position:100% 100%}}
header{position:relative;overflow:hidden}
header:after{content:"";position:absolute;left:-20%;top:0;width:28%;height:100%;background:linear-gradient(100deg,transparent,#ffffff3a,transparent);transform:skewX(-18deg);animation:headerSweep 5s ease-in-out infinite}
@keyframes headerSweep{0%,55%{left:-30%}100%{left:125%}}
.card,.mini{animation:cardIn .65s ease both}
.card:nth-child(2n),.mini:nth-child(2n){animation-delay:.08s}.card:nth-child(3n),.mini:nth-child(3n){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
button{transition:transform .18s,filter .18s,box-shadow .18s}
button:hover{transform:translateY(-4px) scale(1.03);filter:saturate(1.12);box-shadow:0 9px 18px #0002}
button:active{transform:translateY(1px) scale(.98)}


/* --- WHOLE PAGE ANIMATION PACK --- */
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes titlePop{0%{opacity:0;transform:scale(.88) translateY(16px)}70%{opacity:1;transform:scale(1.04) translateY(-3px)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes factShine{0%,55%{left:-35%;opacity:0}65%{opacity:.65}100%{left:125%;opacity:0}}
body{animation:pageIn .7s ease both}
header h1{animation:titlePop .9s cubic-bezier(.2,1.25,.3,1) both}
header p{animation:pageIn .65s .2s ease both}
header .back{animation:pageIn .65s .35s ease both}
.toolbar{animation:pageIn .65s .45s ease both}
.card{position:relative;overflow:hidden;transition:transform .22s ease,box-shadow .22s ease}
.card:after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:24%;background:linear-gradient(100deg,transparent,#fff8,transparent);transform:skewX(-18deg);animation:factShine 6.5s ease-in-out infinite;pointer-events:none}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 30px #0002}
.card h2{animation:bob 3.8s ease-in-out infinite}
.card:nth-child(2n) h2{animation-delay:.25s}.card:nth-child(3n) h2{animation-delay:.5s}
button{transition:transform .18s,filter .18s,box-shadow .18s}
button:hover{transform:translateY(-4px) scale(1.04);filter:saturate(1.14);box-shadow:0 9px 18px #0002}
button:active{transform:translateY(1px) scale(.98)}
@media(prefers-reduced-motion:reduce){
 body{animation:none}.card:after,.card h2{animation:none!important}
 .card:hover{transform:none}
}


/* --- EXTRA WHOLE-PAGE MOTION --- */
@keyframes rainbowFacts{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes floatFacts{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wiggleFacts{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
header{background-size:180% 180%;animation:rainbowFacts 11s ease-in-out infinite}
header h1{animation:titlePop .9s cubic-bezier(.2,1.25,.3,1) both}
.toolbar button{transition:transform .2s ease,box-shadow .2s ease}.toolbar button:hover{transform:translateY(-3px) scale(1.05)}
.toolbar input{transition:transform .2s ease,box-shadow .2s ease}.toolbar input:focus{transform:scale(1.01);box-shadow:0 0 0 5px #9edfff40}
.grid .card:nth-child(4n+1){animation:floatFacts 4.6s ease-in-out infinite}.grid .card:nth-child(4n+2){animation:floatFacts 4.6s .15s ease-in-out infinite}.grid .card:nth-child(4n+3){animation:floatFacts 4.6s .3s ease-in-out infinite}.grid .card:nth-child(4n){animation:floatFacts 4.6s .45s ease-in-out infinite}
.num{animation:floatFacts 2.6s ease-in-out infinite}
.tag{transition:transform .2s ease}.card:hover .tag{transform:scale(1.08) rotate(-2deg)}
.more{background-size:180% 180%;animation:rainbowFacts 8s ease-in-out infinite}
.empty{animation:floatFacts 3.5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){
 header,.grid .card,.num,.more,.empty{animation:none!important}
}


/* --- MAX ENERGY ANIMATION LAYER --- */
@keyframes auroraFacts{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes floatFacts2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes titlePulseFacts{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes shineFacts2{0%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(600%) skewX(-18deg)}}
body{background-size:220% 220%;animation:auroraFacts 13s ease-in-out infinite alternate}
header{background-size:240% 240%;animation:auroraFacts 10s ease-in-out infinite}
header h1{animation:titlePop .9s cubic-bezier(.2,1.25,.3,1) both,titlePulseFacts 3.2s 1s ease-in-out infinite}
.toolbar button.active{animation:floatFacts2 2.8s ease-in-out infinite}
.grid .card{will-change:transform}
.grid .card:hover{transform:translateY(-8px) rotate(-.45deg) scale(1.02);box-shadow:0 20px 34px #0002}
.grid .card:after{animation:shineFacts2 5.5s linear infinite}
.num{animation:floatFacts2 2.5s ease-in-out infinite}
.tag{animation:floatFacts2 3.3s .2s ease-in-out infinite}
.more{box-shadow:0 10px 22px #0002;transition:transform .2s,box-shadow .2s}.more:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 16px 28px #0003}


.toolbar,.grid .card,.more{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.seen{opacity:1!important;transform:none!important}
/* --- COLOUR BOOST --- */
body{background:linear-gradient(180deg,#effaff 0%,#f8f0ff 48%,#fff2e8 100%)}
header{background:linear-gradient(135deg,#2f80ed,#7b4dcc,#ff6b9f,#ff8b3d)!important;background-size:250% 250%}
.toolbar{background:linear-gradient(90deg,#e9f8ff,#f4edff,#fff0e7);padding:10px;border-radius:18px}
.toolbar button:nth-child(1){background:#e8f7ff}.toolbar button:nth-child(2){background:#efe8ff}.toolbar button:nth-child(3){background:#fff0e7}.toolbar button:nth-child(4){background:#eafff5}.toolbar button:nth-child(5){background:#ffeaf2}.toolbar button:nth-child(6){background:#ffeaf2}
.grid .card:nth-child(6n+1){border-color:#9edfff;background:linear-gradient(145deg,#fff,#f1fbff)}
.grid .card:nth-child(6n+2){border-color:#c3afff;background:linear-gradient(145deg,#fff,#f7f2ff)}
.grid .card:nth-child(6n+3){border-color:#ffc095;background:linear-gradient(145deg,#fff,#fff6ee)}
.grid .card:nth-child(6n+4){border-color:#8fd8c0;background:linear-gradient(145deg,#fff,#f0fff8)}
.grid .card:nth-child(6n+5){border-color:#f0d56c;background:linear-gradient(145deg,#fff,#fffbea)}
.grid .card:nth-child(6n){border-color:#ffb3ce;background:linear-gradient(145deg,#fff,#fff1f6)}
.tag{background:linear-gradient(90deg,#eef5ff,#f3eaff,#fff1e5)}

</style>
</head>
<body>
<header>
<h1>🐴 99 Horse Facts</h1>
<p>Learn something new about horses!</p>
<a class="back" href="index.html">← Back to Pony Sitters Club</a>
</header>
<main>
<div class="toolbar">
<button class="active" data-filter="All">All</button>
<button data-filter="Body">Body</button>
<button data-filter="Behavior">Behavior</button>
<button data-filter="Colors">Colors</button>
<button data-filter="Breeds">Breeds</button>
<button data-filter="Care">Care</button>
<button data-filter="History">History</button>
<input id="search" type="search" placeholder="🔎 Search the facts">
</div>
<div id="count" class="count">99 facts</div>
<div id="grid" class="grid"></div>
<button id="more" class="more">Show more facts</button>
</main>
<script>
const horseFacts99=[
["Body","Horses are mammals.","A horse is a warm-blooded mammal."],
["Body","Horses are herbivores.","Their natural diet is made mainly from plant foods."],
["Body","A horse's hoof has one main weight-bearing toe.","The horse's foot is built around a single large central digit."],
["Body","Hooves are made mostly of keratin.","Keratin is the tough protein also found in human hair and fingernails."],
["Body","Horses have very strong legs.","Their leg structure helps them support their large body while moving quickly."],
["Body","Horses have large lungs.","Large lungs help support their active, running lifestyle."],
["Body","Horses breathe mostly through their nostrils.","They normally do not breathe through their mouths."],
["Body","A horse's ears can move in different directions.","Each ear can turn to help locate sounds."],
["Body","Horses have whiskers around their muzzle.","These hairs help them sense nearby objects."],
["Body","Horses have a very wide field of view.","The position of their eyes lets them see a lot of the area around them."],
["Body","Horse eyes are among the largest of land mammals.","Their large eyes are useful for detecting movement around them."],
["Body","Horses can see in color.","Their color vision is not exactly the same as a human's."],
["Body","Horses have a long neck.","The long neck helps them balance and reach food."],
["Body","A horse's mane grows along the neck.","The mane is made of long hairs."],
["Body","A horse's tail has long hair.","The tail can help swat flies away."],
["Body","Horses have a digestive system suited to grazing.","Their gut works well with frequent intake of fibrous food."],
["Body","Horses cannot vomit.","Their digestive anatomy makes vomiting very difficult or effectively impossible."],
["Body","Horses have hypsodont teeth.","Their teeth are adapted for grinding fibrous food."],
["Body","A horse's adult teeth can change shape as they wear.","Tooth wear is part of why dental care matters."],
["Body","Horses have a chestnut on each leg.","A chestnut is a small, hard patch of skin on the inside of the legs."],
["Behavior","Horses are social animals.","They usually prefer living with other horses or having safe social contact."],
["Behavior","Horses communicate with body language.","Ears, eyes, tail, posture and movement can all give signals."],
["Behavior","A pinned-back ear can be a warning sign.","A horse may flatten its ears when it is upset, focused or uncomfortable."],
["Behavior","A relaxed horse may keep its ears in a neutral position.","Ear position changes with attention and mood."],
["Behavior","Horses can neigh.","Neighs can be used to communicate across distance."],
["Behavior","Horses also make softer sounds.","They can nicker, snort, blow and squeal."],
["Behavior","Horses may groom one another.","Mutual grooming can help strengthen social bonds."],
["Behavior","Horses can recognize familiar individuals.","They can learn people, horses and routines they know."],
["Behavior","Horses can learn by repetition.","Consistent practice helps them remember responses."],
["Behavior","Horses have good memories.","They can remember learned tasks, places and experiences."],
["Behavior","Horses are prey animals.","Their senses and quick movement help them detect possible danger."],
["Behavior","Horses can startle quickly.","Sudden movement or sound can trigger a fast reaction."],
["Behavior","Horses often investigate new things carefully.","They may look, sniff or approach before deciding what to do."],
["Behavior","Horses can rest while standing.","Their leg joints can lock into a stable resting position."],
["Behavior","Horses can also sleep lying down.","Deeper sleep includes periods when they lie down."],
["Behavior","Horses need some REM sleep.","REM sleep normally occurs when a horse is lying down."],
["Behavior","Foals sleep more than adult horses.","Young horses spend more time resting and sleeping."],
["Behavior","Horses often graze for many hours.","Frequent eating suits their digestive system."],
["Behavior","Horses naturally move a lot.","Their natural routines include walking, grazing and social interaction."],
["Behavior","A horse may use its tail to communicate.","Tail movement can show attention, irritation or relaxation."],
["Colors","Buckskin is a coat color, not a breed.","Many different horse breeds can have buckskin-colored horses."],
["Colors","Buckskin horses usually have a tan or golden body.","Their coat is often paired with darker points."],
["Colors","A buckskin usually has dark mane and tail hair.","This dark coloring is a classic buckskin feature."],
["Colors","Bay horses have a brown body with black points.","Black points include the mane, tail and lower legs."],
["Colors","Chestnut horses have reddish coats.","Their mane and tail can also be reddish instead of black."],
["Colors","Black horses have mostly black coats.","Some can show slight fading or sun bleaching."],
["Colors","Gray horses are born a darker color.","Many gray horses lighten as they age."],
["Colors","White and gray are not the same coat color.","A gray horse can become very light even though it started darker."],
["Colors","Palomino horses have golden coats.","They usually have lighter or flaxen manes and tails."],
["Colors","Dun horses are known for dilution of the body color.","Dun horses may also show primitive markings."],
["Colors","Roan coats have a mix of white and colored hairs.","The white hairs are mixed through the coat rather than replacing it completely."],
["Colors","Appaloosa describes a recognizable group of coat patterns.","Common examples include spots, blankets and mottling."],
["Colors","Pinto describes a pattern of large white patches.","The base coat underneath can be many different colors."],
["Colors","Some horse coat colors change with age.","Gray is a well-known example."],
["Colors","Sunlight can fade some horse coats.","Dark coats can sometimes look lighter after lots of sun exposure."],
["Colors","A horse's muzzle can be a different shade from its body.","Some horses have lighter or darker skin and hair around the face."],
["Breeds","Arabian is one of the world's famous horse breeds.","Arabian horses are known for their endurance and distinctive head shape."],
["Breeds","Thoroughbreds are famous racing horses.","The breed developed in England and is widely used in racing."],
["Breeds","Quarter Horses are known for short-distance speed.","The breed is also widely used for many riding activities."],
["Breeds","Clydesdales are draft horses.","They are large, strong horses traditionally used for pulling."],
["Breeds","Shire horses are draft horses.","Shires are known for their large size and strength."],
["Breeds","Friesians are usually black.","The breed is known for its long mane, tail and feathering."],
["Breeds","Shetland Ponies are small and sturdy.","They come from the Shetland Islands."],
["Breeds","The Falabella is a very small horse breed.","It is known for its miniature size."],
["Breeds","Mustangs are free-roaming horses in North America.","They descend mainly from horses introduced by people."],
["Breeds","Icelandic horses come from Iceland.","They are known for their sure-footedness and unique gaits."],
["Breeds","Haflingers are usually chestnut or flaxen-colored.","They are a sturdy breed developed in the Alps."],
["Breeds","Andalusian horses originated in Spain.","The breed is known for its elegant movement and history as a riding horse."],
["Breeds","Appaloosa is also the name of a horse breed.","The breed is strongly associated with distinctive coat patterns."],
["Breeds","Morgan horses originated in the United States.","The breed is known for versatility and a compact, strong build."],
["Breeds","Suffolk Punch horses are a British draft breed.","They are commonly chestnut in color."],
["Breeds","Friesians have a long history in the Netherlands.","They were developed in Friesland."],
["Care","Fresh water is essential for horses.","Horses need regular access to clean drinking water."],
["Care","Horses need forage in their diet.","Hay or pasture supplies important fiber."],
["Care","Horses need regular hoof care.","Routine trimming or shoeing helps keep feet healthy."],
["Care","Horses need dental checks.","Their teeth can wear unevenly and may need professional care."],
["Care","Horses benefit from regular movement.","Exercise supports muscles, fitness and healthy joints."],
["Care","Grooming can remove dirt and loose hair.","It also gives people a chance to notice changes on the skin or coat."],
["Care","Shade can help horses stay cooler.","Good management also includes ventilation and access to water."],
["Care","Horses need protection from extreme weather.","Shelter, shade and sensible turnout can help."],
["Care","A horse's diet should change gradually.","Sudden feed changes can upset the digestive system."],
["Care","Horses should be checked every day.","Daily observation can help spot changes in eating, movement or behavior."],
["Care","Safe fencing matters around horses.","Good fences help reduce escape and injury risks."],
["Care","Horses need parasite control.","Veterinarians and horse-care professionals can help plan appropriate programs."],
["Care","Vaccination can protect horses from disease.","Vaccination plans depend on local risks and veterinary advice."],
["Care","Horses should have regular veterinary care.","Routine checks help maintain health and catch problems early."],
["Care","A horse's tack should fit correctly.","Poorly fitting equipment can cause discomfort or injury."],
["Care","Horses should be handled calmly.","Quiet, consistent handling helps reduce unnecessary stress."],
["History","Humans have been working with horses for thousands of years.","People have used horses for travel, farming, sport and companionship."],
["History","Horses helped transform transportation.","Before modern engines, horses powered many journeys and vehicles."],
["History","Horse-drawn vehicles included carriages and wagons.","Different designs were used for travel, work and hauling."],
["History","Horses played major roles in agriculture.","They pulled plows, wagons and other farm equipment."],
["History","The earliest known horse ancestors were much smaller.","Ancient early horses were different in size and shape from modern horses."],
["History","Modern horses belong to the genus Equus.","Zebras and donkeys are also in the genus Equus."],
["History","Horses and zebras can sometimes produce hybrids.","For example, a zebra and horse can produce a zorse, although such hybrids are not the same as a horse breed."],
["History","A male horse is called a stallion when intact.","A castrated male horse is called a gelding."],
["History","A female horse is called a mare.","A young horse is often called a foal."],
["History","A male foal is a colt.","A female foal is a filly."],
["History","An adult horse has 36 to 44 teeth.","The exact number can vary with sex and individual tooth development."]
];

let factsVisible=24;;
let visible=24,active="All";
const grid=document.getElementById("grid"),count=document.getElementById("count"),search=document.getElementById("search"),more=document.getElementById("more");
function render(){
 const q=search.value.toLowerCase().trim();
 const list=horseFacts99.map((x,i)=>({category:x[0],title:x[1],text:x[2],num:i+1}))
  .filter(x=>(active==="All"||x.category===active)&&(!q||(x.title+" "+x.text+" "+x.category).toLowerCase().includes(q)));
 const shown=list.slice(0,visible);
 count.textContent=list.length+" fact"+(list.length===1?"":"s")+" found • showing "+shown.length;
 grid.innerHTML=shown.length?shown.map(x=>'<article class="card"><div class="top"><span class="num">'+x.num+'</span><span class="tag">'+x.category+'</span></div><h2>'+x.title+'</h2><p>'+x.text+'</p></article>').join(""):'<div class="empty">No facts matched that search. 🐴</div>';
 more.style.display=shown.length<list.length?"block":"none";
 more.textContent="Show more facts ("+(list.length-shown.length)+")";
}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");active=b.dataset.filter;visible=24;render();});
search.oninput=()=>{visible=24;render()};
more.onclick=()=>{visible+=24;render()};
render();

(function(){
  const bits=["✨","⭐","🐴","💜","💙"];
  bits.forEach(function(ch,i){
    const x=document.createElement("span");
    x.textContent=ch;
    x.style.cssText="position:fixed;left:"+(10+i*18)+"vw;top:"+(9+(i%3)*27)+"vh;font-size:24px;opacity:.16;pointer-events:none;z-index:0;animation:floatFact 6s ease-in-out "+(i*.5)+"s infinite alternate";
    document.body.appendChild(x);
  });
  const style=document.createElement("style");
  style.textContent="@keyframes floatFact{from{transform:translateY(8px) rotate(-8deg)}to{transform:translateY(-18px) rotate(8deg)}}";
  document.head.appendChild(style);
})();

/* --- MAX ENERGY MOTION JS --- */
(function(){
  const targets=document.querySelectorAll(".toolbar,.grid .card,.more");
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("seen");io.unobserve(e.target);}});
  },{threshold:.08});
  targets.forEach((el,i)=>{el.style.transitionDelay=Math.min(i*18,240)+"ms";io.observe(el);});
})();
</script>
</body>
</html>
